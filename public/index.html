<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kvíz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Kvíz</h1>
  </header>

  <main>
    <section id="settings" aria-label="Kérdések száma kategóriánként">
      <div id="category-counts"></div>
      <p id="total" aria-live="polite"></p>
    </section>

    <p id="error" class="error" hidden></p>

    <section id="questions" class="grid" aria-live="polite"></section>
  </main>

  <footer>
    <button id="reroll" type="button">🎲 Új kérdések sorsolása</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
